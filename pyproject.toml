[project]
name = "red-assistant"
version = "0.1.0"
description = "Assistant vocal local en francais, Ollama et moteurs locaux, cloud optionnel (domotique, PC, web, communication)."
readme = "README.md"
authors = [
    { name = "red-assistant" }
]
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "PyNaCl>=1.6,<2",
    "cryptography>=44",
    "truststore>=0.10",
]

[project.optional-dependencies]
speech = [
    "numpy>=2.2",
    "scipy>=1.15",
    "faster-whisper>=1.2",
    "vosk==0.3.45",
    "piper-tts>=1.3",
]
admin = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=14",
]
desktop = [
    "sounddevice>=0.5",
    "keyboard>=0.13.5",
    "pillow>=11",
    "mss>=10",
    "psutil>=7",
    "miniaudio>=1.61",
    "ddgs>=9",
]
local = [
    "numpy>=2.2",
    "scipy>=1.15",
    "faster-whisper>=1.2",
    "vosk==0.3.45",
    "piper-tts>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=14",
    "sounddevice>=0.5",
    "keyboard>=0.13.5",
    "pillow>=11",
    "mss>=10",
    "psutil>=7",
    "miniaudio>=1.61",
    "ddgs>=9",
]
cloud = [
    "openai>=2",
    "anthropic>=0.80",
]
calls = [
    "twilio>=9",
    "pyngrok>=8",
    "soundcard>=0.4",
    "audioop-lts>=0.2; python_version >= '3.13'",
]
discord = [
    "discord-py>=2.5",
    "audioop-lts>=0.2; python_version >= '3.13'",
]
agenda = [
    "google-api-python-client>=2.160",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "icalendar>=6",
]
alexa = [
    "alexapy>=1.30",
]
obs = [
    "obsws-python>=1.8",
]
browser = [
    "playwright>=1.50",
]
mcp = [
    "mcp>=1.20",
]
cuda = [
    "nvidia-cublas-cu12>=12.9; platform_system != 'Darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "nvidia-cudnn-cu12>=9; platform_system != 'Darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]
dev = [
    "httpx>=0.28",
    "build>=1.2",
    "black>=24",
]

[project.scripts]
red-assistant = "assistant_vocal.__main__:main"
jarvis-vocal = "assistant_vocal.__main__:main" # compatibilité temporaire

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["assistant_vocal*", "audio*", "core*", "services*", "integrations*", "tools*", "modules*", "security*", "conversation*", "transports*", "interfaces*", "observability*", "devices*", "web*", "scripts*", "gestes*", "jarvis*"]
exclude = ["tests*", "runtime*", "models*"]

[tool.setuptools.package-data]
web = ["*.html", "*.js", "*.css"]
modules = ["*/manifest.json"]
